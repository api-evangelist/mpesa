meters:
- name: c2b_collection_transactions
  description: Inbound C2B / STK Push collection transactions, tariffed per amount band.
  unit: transactions
  aggregation: sum
  dimensions:
  - shortcode
  - product
  - amount_band
- name: b2c_disbursement_transactions
  description: Outbound B2C payouts (salary/business/promotion), tariffed per amount band.
  unit: transactions
  aggregation: sum
  dimensions:
  - shortcode
  - command_id
  - amount_band
- name: b2b_transfer_transactions
  description: Business-to-business transfers between shortcodes, tariffed per amount band.
  unit: transactions
  aggregation: sum
  dimensions:
  - shortcode
  - command_id
  - amount_band
- name: float_balance
  description: Working/available float on the business shortcode funding disbursements.
  unit: KES
  aggregation: last
  dimensions:
  - shortcode
principles:
- name: Visibility
  description: Reconcile M-Pesa statements and ResultURL callbacks per shortcode; track transaction count and tariff by product.
- name: Allocation
  description: Map shortcodes / paybills to business units and cost centers; tag Daraja apps per workload.
- name: Optimization
  description: Batch and net disbursements, keep float sized to demand, and choose the lowest-tariff product path for each payment type.
- name: Accountability
  description: Assign an owner per shortcode; review transaction spend and failed/reversed transactions monthly.
