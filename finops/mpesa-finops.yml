  chargeCategories:
  - Usage
  - Tax
  - Adjustment
focusColumns:
  ServiceName: M-Pesa Daraja
  ServiceCategory: Payments and Financial Services
  ProviderName: Safaricom
  PublisherName: Safaricom
  InvoiceIssuerName: Safaricom
