description: >-
  FinOps view of M-Pesa Daraja spend. The Daraja API carries no per-call fee; cost is
  the underlying M-Pesa transaction tariff per product (C2B collection, B2C
  disbursement, B2B transfer), billed in Kenyan Shillings (KES) and settled against the
  business shortcode float. Tariffs follow CBK-regulated bands and the merchant's
  commercial agreement, so cost is driven by transaction count, amount band, and
  product mix rather than by API usage.
notes: >-
  Per-transaction tariffs are commercial/regulated and not published as a fixed public
  rate card; reconcile against Safaricom merchant statements and CBK tariff bands.
sources:
- https://developer.safaricom.co.ke/
- https://www.safaricom.co.ke/business/sme/payment-solutions
- https://focus.finops.org/focus-specification/v1-3/
