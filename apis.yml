aid: mpesa
url: https://raw.githubusercontent.com/api-evangelist/mpesa/refs/heads/main/apis.yml
name: M-Pesa (Safaricom Daraja)
kind: company
description: M-Pesa is Safaricom's mobile-money platform for Kenya, exposed to developers
  through the Daraja API. The Daraja REST APIs let businesses collect payments (M-Pesa
  Express / STK Push, C2B), disburse funds (B2C, B2B), query transactions and balances,
  reverse payments, generate dynamic QR codes, and run standing orders — authorized
  with OAuth bearer tokens minted from Basic credentials, priced in Kenyan Shillings
  (KES).
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Mobile Money
- Payments
- Fintech
- Kenya
- Africa
- M-Pesa
created: '2026-07-17'
modified: '2026-07-17'
specificationVersion: '0.19'
apis:
- aid: mpesa:mpesa-authorization-api
  name: M-Pesa Authorization API
  tags:
  - OAuth
  - Authentication
  - Access Token
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.safaricom.co.ke/APIs/Authorization
  baseURL: https://api.safaricom.co.ke
  properties:
  - url: https://developer.safaricom.co.ke/APIs/Authorization
    type: Documentation
  - url: openapi/mpesa-openapi.yml
    type: OpenAPI
  - url: collections/mpesa.postman_collection.json
    type: PostmanCollection
  description: Mints a short-lived OAuth access token from Basic-authenticated consumer
    key and secret via GET /oauth/v1/generate?grant_type=client_credentials; the token
    is used as a Bearer credential on all other Daraja calls.
